<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NETRA OSINT - Sign In</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #060913;
            --card-bg: rgba(15, 23, 42, 0.85);
            --card-border: rgba(59, 130, 246, 0.2);
            --primary: #3b82f6;
            --accent: #06b6d4;
            --ig-pink: #d62976;
            --ig-gradient: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.25) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(220, 39, 67, 0.2) 0px, transparent 50%);
            color: #f8fafc;
            padding: 20px;
        }

        .login-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 44px 36px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--ig-gradient);
        }

        .brand-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #1e3a8a, var(--primary), var(--accent));
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            color: white;
            margin: 0 auto 18px;
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .title-brand {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff, #93c5fd, #67e8f9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        .subtitle-brand {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 32px;
            font-weight: 500;
        }

        .form-field {
            margin-bottom: 20px;
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            font-size: 16px;
        }

        .input {
            width: 100%;
            padding: 14px 16px 14px 44px;
            background: rgba(6, 9, 19, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            color: white;
            font-size: 14px;
            outline: none;
            transition: all 0.2s ease;
        }

        .input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 16px rgba(59, 130, 246, 0.4);
        }

        .btn-submit {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--primary), #2563eb);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(37, 99, 235, 0.4);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 22px rgba(37, 99, 235, 0.6);
        }
    </style>
</head>

<body>
    <div class="login-card">
        <div class="brand-icon"><i class="fas fa-radar"></i></div>
        <h1 class="title-brand">NETRA OSINT</h1>
        <p class="subtitle-brand">Zero-Permission Tracking Platform</p>

        <form action="/login" method="post">
            <div class="form-field">
                <i class="fas fa-user input-icon"></i>
                <input type="text" class="input" placeholder="Username" required name="username">
            </div>

            <div class="form-field">
                <i class="fas fa-key input-icon"></i>
                <input type="password" class="input" placeholder="Password" required name="password">
            </div>

            <button type="submit" class="btn-submit">
                <span>Sign In to Terminal</span> <i class="fas fa-arrow-right"></i>
            </button>
        </form>
    </div>
</body>

</html>
