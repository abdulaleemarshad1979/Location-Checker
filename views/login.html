<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NETRA - THE EYE | Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            display: grid;
            place-items: center;
            height: 100vh;
            background-color: #0b0f19;
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.2) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.2) 0px, transparent 50%);
            color: #f8fafc;
        }

        .login-card {
            background: rgba(23, 32, 54, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px 32px;
            width: 360px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .brand-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #3b82f6, #06b6d4);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: white;
            margin: 0 auto 16px;
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.5);
        }

        .title-brand {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }

        .subtitle-brand {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 28px;
        }

        .field {
            margin-bottom: 18px;
        }

        .input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(11, 15, 25, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
        }

        .input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.3);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
            transition: all 0.2s;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.6);
        }

        .error-alert {
            display: none;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 18px;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="login-card">
        <div class="brand-icon"><i class="fas fa-eye"></i></div>
        <h1 class="title-brand">NETRA</h1>
        <p class="subtitle-brand">THE EYE • Surveillance Operations Platform</p>

        <div id="error-alert" class="error-alert">
            <i class="fas fa-circle-exclamation me-1"></i> Invalid username or password
        </div>

        <form action="/login" method="post">
            <div class="field">
                <input type="text" class="input" placeholder="Username" required name="username">
            </div>

            <div class="field">
                <input type="password" class="input" placeholder="Password" required name="password">
            </div>

            <button type="submit" class="btn-submit">Sign In to Dashboard</button>
        </form>
    </div>

    <script>
        if (new URLSearchParams(window.location.search).get('error') === 'invalid') {
            document.getElementById('error-alert').style.display = 'block';
        }
    </script>
</body>

</html>
